# Data@Spark seed catalog. Consumed by seed.py. Topic names are CKAN group
# names from ckanext-spark topics.py. Edit here, re-run seed.py (idempotent).
organizations:
  - {name: bu-spark, title: BU Spark!, description: "Datasets produced or collected by BU Spark! projects."}
  - {name: analyze-boston-external, title: "Analyze Boston (external)", description: "Pointers to datasets published on Analyze Boston (data.boston.gov). Link only; nothing is mirrored here."}
  - {name: external-sources, title: External sources, description: "Pointers to public datasets published by other organizations. Link only."}


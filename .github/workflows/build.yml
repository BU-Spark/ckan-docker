name: Build CKAN Docker

on:
  push:
    branches:
      - master
      - production
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  DATA_AT_SPARK_IMAGE: ghcr.io/bu-spark/data-at-spark

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       with:
          persist-credentials: false

    -  name: Set up Docker Buildx
       uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    -  name: NGINX build
       uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
       with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          tags: kowhai/ckan-docker-nginx:test-build-only

    -  name: PostgreSQL build
       uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
       with:
          context: ./postgresql
          file: ./postgresql/Dockerfile
          push: false
          tags: kowhai/ckan-docker-postgresql:test-build-only

    -  name: CKAN build
       uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
       with:
          context: ./ckan
          file: ./ckan/Dockerfile
          push: false
          tags: kowhai/ckan-docker-ckan:test-build-only

    -  name: Render Data@Spark Compose configuration
       run: |
          cp .env.example .env
          cp data-at-spark/.env.example data-at-spark/.env
          docker compose \
            --env-file .env \
            --env-file data-at-spark/.env \
            -f docker-compose.yml \
            -f data-at-spark/compose.yml \
            config

    -  name: Check Data@Spark operator scripts
       run: |
          bash -n \
            data-at-spark/ansible/bin/hourly-smoke-check \
            data-at-spark/ansible/bin/local-smoke \
            data-at-spark/ansible/bin/runtime-backup \
            data-at-spark/ansible/bin/runtime-restore-test

    -  name: Data@Spark CKAN build
       uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
       with:
          context: .
          file: ./data-at-spark/Dockerfile
          push: false
          tags: bu-spark/data-at-spark:test-build-only

  publish-data-at-spark:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: data-at-spark-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      image: ${{ env.DATA_AT_SPARK_IMAGE }}
      image-ref: ${{ env.DATA_AT_SPARK_IMAGE }}@${{ steps.resolve.outputs.digest }}
    steps:
    -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       with:
          persist-credentials: false

    -  name: Set up Docker Buildx
       uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    -  name: Log in to GHCR
       uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
       with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    -  name: Check for an existing source SHA tag
       id: existing
       run: |
          inspect_error="$(mktemp)"
          trap 'rm -f "${inspect_error}"' EXIT
          set +e
          digest="$(
            docker buildx imagetools inspect \
              "${DATA_AT_SPARK_IMAGE}:${GITHUB_SHA}" \
              --format '{{ .Manifest.Digest }}' 2>"${inspect_error}"
          )"
          inspect_status=$?
          set -e

          if [ "${inspect_status}" -eq 0 ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          inspect_output="$(cat "${inspect_error}")"
          case "${inspect_output}" in
            *"manifest unknown"*|*"not found"*)
              echo "exists=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unable to determine whether the source SHA tag exists:" >&2
              echo "${inspect_output}" >&2
              exit "${inspect_status}"
              ;;
          esac

    -  name: Check existing image provenance
       if: steps.existing.outputs.exists == 'true'
       id: provenance
       env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest }}
       run: |
          verify_error="$(mktemp)"
          trap 'rm -f "${verify_error}"' EXIT
          set +e
          gh attestation verify \
            "oci://${DATA_AT_SPARK_IMAGE}@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" 2>"${verify_error}"
          verify_status=$?
          set -e

          if [ "${verify_status}" -eq 0 ]; then
            echo "reuse=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          verify_output="$(cat "${verify_error}")"
          case "${verify_output}" in
            *"no attestations found"*|*"no attestation found"*)
              echo "reuse=false" >> "${GITHUB_OUTPUT}"
              echo "The existing SHA image has no provenance; rebuilding it."
              ;;
            *)
              echo "Unable to verify existing image provenance:" >&2
              echo "${verify_output}" >&2
              exit "${verify_status}"
              ;;
          esac

    -  name: Publish immutable Data@Spark image
       if: >-
          steps.existing.outputs.exists == 'false' ||
          steps.provenance.outputs.reuse == 'false'
       id: publish
       uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
       with:
          context: .
          file: ./data-at-spark/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DATA_AT_SPARK_IMAGE }}:${{ github.sha }}
          labels: |
             org.opencontainers.image.revision=${{ github.sha }}
             org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

    -  name: Resolve published digest
       id: resolve
       env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
       run: |
          digest="${PUBLISHED_DIGEST:-${EXISTING_DIGEST}}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid or missing image digest: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

    -  name: Attest resolved image
       if: steps.publish.outcome == 'success'
       uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
       with:
          subject-name: ${{ env.DATA_AT_SPARK_IMAGE }}
          subject-digest: ${{ steps.resolve.outputs.digest }}
          push-to-registry: true

    -  name: Record published image
       env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.digest }}
       run: |
          echo "Published \`${DATA_AT_SPARK_IMAGE}@${IMAGE_DIGEST}\`" \
            >> "${GITHUB_STEP_SUMMARY}"

  promote-integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish-data-at-spark
    runs-on: ubuntu-latest
    concurrency:
      group: data-at-spark-integration-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
    -  name: Set up Docker Buildx
       uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    -  name: Log in to GHCR
       uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
       with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    -  name: Advance integration tag to the published digest
       id: promote
       env:
          IMAGE_DIGEST: ${{ needs.publish-data-at-spark.outputs.digest }}
          WORKFLOW_SHA: ${{ github.sha }}
       run: |
          master_sha="$(
            git ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              refs/heads/master |
              cut -f1
          )"
          if [ "${master_sha}" != "${WORKFLOW_SHA}" ]; then
            echo "promoted=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale integration promotion for ${WORKFLOW_SHA}"
            exit 0
          fi
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DATA_AT_SPARK_IMAGE}:integration" \
            "${DATA_AT_SPARK_IMAGE}@${IMAGE_DIGEST}"
          echo "promoted=true" >> "${GITHUB_OUTPUT}"

    -  name: Verify integration tag digest
       if: steps.promote.outputs.promoted == 'true'
       env:
          IMAGE_DIGEST: ${{ needs.publish-data-at-spark.outputs.digest }}
       run: |
          integration_digest="$(
            docker buildx imagetools inspect \
              "${DATA_AT_SPARK_IMAGE}:integration" \
              --format '{{ .Manifest.Digest }}'
          )"
          test "${integration_digest}" = "${IMAGE_DIGEST}"
          {
            echo "Promoted \`${DATA_AT_SPARK_IMAGE}:integration\`"
            echo "to \`${DATA_AT_SPARK_IMAGE}@${IMAGE_DIGEST}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

    # GHCR does not fire a registry_package webhook for a pure retag (only for
    # an actual new push) -- confirmed empirically, not documented. Every
    # master push also does a real push of the :<sha> tag in the same run, so
    # that push's event happens to be what has triggered int's redeploy so
    # far; this job's own retag was never actually the trigger. Self-POSTing
    # here removes that dependency on GHCR's undocumented event behavior
    # rather than leaving it working by coincidence.
    -  name: Trigger the int redeploy directly
       if: steps.promote.outputs.promoted == 'true'
       env:
          WEBHOOK_SECRET: ${{ secrets.DATA_AT_SPARK_INT_WEBHOOK_SECRET }}
       run: |
          body='{"action":"published"}'
          signature="sha256=$(printf '%s' "${body}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" | sed 's/^.* //')"
          curl -fsS -X POST "https://hooks.int.buspark.io/hooks/data-at-spark-ghcr-int" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: registry_package" \
            -H "X-Hub-Signature-256: ${signature}" \
            --data "${body}"

  # Production promotion is a retag, never a rebuild: `production` only ever
  # holds commits that were already pushed to `master` and built/attested
  # there (e.g. `git push origin master:production` for a commit that has
  # already run stable on int). This job resolves that commit's existing
  # `:<sha>` tag and requires it to already carry the same attestation
  # `publish-data-at-spark` produces -- if the SHA was never actually built
  # via master, this fails loudly instead of building something new and
  # unreviewed straight to prod.
  promote-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: data-at-spark-production-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
    -  name: Set up Docker Buildx
       uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    -  name: Log in to GHCR
       uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
       with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    -  name: Resolve the pushed commit's already-published digest
       id: resolve
       run: |
          digest="$(
            docker buildx imagetools inspect \
              "${DATA_AT_SPARK_IMAGE}:${GITHUB_SHA}" \
              --format '{{ .Manifest.Digest }}'
          )"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "No published ${DATA_AT_SPARK_IMAGE}:${GITHUB_SHA} tag -- this" >&2
            echo "commit was never built via master. Refusing to build a new" >&2
            echo "image for production; merge/push the already-tested master" >&2
            echo "commit to production instead." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

    -  name: Verify provenance of the commit being promoted
       env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.resolve.outputs.digest }}
       run: |
          gh attestation verify \
            "oci://${DATA_AT_SPARK_IMAGE}@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}"

    -  name: Advance production tag to the resolved digest
       id: promote
       env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.digest }}
          WORKFLOW_SHA: ${{ github.sha }}
       run: |
          production_sha="$(
            git ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              refs/heads/production |
              cut -f1
          )"
          if [ "${production_sha}" != "${WORKFLOW_SHA}" ]; then
            echo "promoted=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale production promotion for ${WORKFLOW_SHA}"
            exit 0
          fi
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DATA_AT_SPARK_IMAGE}:production" \
            "${DATA_AT_SPARK_IMAGE}@${IMAGE_DIGEST}"
          echo "promoted=true" >> "${GITHUB_OUTPUT}"

    -  name: Verify production tag digest
       env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.digest }}
       run: |
          production_digest="$(
            docker buildx imagetools inspect \
              "${DATA_AT_SPARK_IMAGE}:production" \
              --format '{{ .Manifest.Digest }}'
          )"
          test "${production_digest}" = "${IMAGE_DIGEST}"
          {
            echo "Promoted \`${DATA_AT_SPARK_IMAGE}:production\`"
            echo "to \`${DATA_AT_SPARK_IMAGE}@${IMAGE_DIGEST}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

    # See the matching comment on promote-integration's trigger step: GHCR
    # does not fire a registry_package webhook for a pure retag, and every
    # promotion here IS a pure retag (production never gets a fresh push of
    # its own) -- so without this step, production's redeploy would never
    # fire at all.
    -  name: Trigger the production redeploy directly
       if: steps.promote.outputs.promoted == 'true'
       env:
          WEBHOOK_SECRET: ${{ secrets.DATA_AT_SPARK_PROD_WEBHOOK_SECRET }}
       run: |
          body='{"action":"published"}'
          signature="sha256=$(printf '%s' "${body}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" | sed 's/^.* //')"
          curl -fsS -X POST "https://hooks.buspark.io/hooks/data-at-spark-ghcr-prod" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: registry_package" \
            -H "X-Hub-Signature-256: ${signature}" \
            --data "${body}"
